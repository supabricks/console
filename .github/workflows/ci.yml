name: console
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Audit navigation regression
        run: |
          npx playwright install --with-deps chromium
          node scripts/governed-audit-test.mjs
      - name: Check product harness syntax
        run: for script in scripts/*.mjs; do node --check "$script"; done
      - uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.os }}
          path: |
            dist/
            build/console-source.json
